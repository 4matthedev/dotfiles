
# ==========================================
# NORD HYPRLAND CONFIGURATION
# Arch Linux | NVIDIA RTX 3060
# ==========================================

$mod = SUPER

# Monitor
monitor = HDMI-A-1,1920x1080@180,auto,1

# Environment
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland

# General
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2

    col.active_border = rgba(88c0d0ee)
    col.inactive_border = rgba(4c566aaa)

    layout = dwindle
}

# Decoration
decoration {
    rounding = 8

    blur {
        enabled = true
        size = 5
        passes = 2
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(00000055)
    }
}

# Animations
animations {
    enabled = true
}

# Layout
dwindle {
    pseudotile = true
    preserve_split = true
}

# Input
input {
    kb_layout = de
    follow_mouse = 1
    sensitivity = 0
}

# Applications
$terminal = kitty
$menu = wofi --show drun

# ==========================================
# AUTOSTART
# ==========================================

exec-once = env GTK_MODULES=gail:atk-bridge waybar
exec-once = env GTK_MODULES=gail:atk-bridge /home/turker/.local/bin/mediapanel.py
exec-once = mako
exec-once = hyprpaper
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# ==========================================
# APPLICATION SHORTCUTS
# ==========================================

bind = $mod, RETURN, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, E, exec, thunar

# ==========================================
# WINDOW CONTROLS
# ==========================================

bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exit
bind = $mod, F, fullscreen
bind = $mod, SPACE, togglefloating

# ==========================================
# FOCUS MOVEMENT
# ==========================================

bind = $mod, LEFT, movefocus, l
bind = $mod, RIGHT, movefocus, r
bind = $mod, UP, movefocus, u
bind = $mod, DOWN, movefocus, d

# ==========================================
# MOVE WINDOWS
# ==========================================

bind = $mod SHIFT, LEFT, movewindow, l
bind = $mod SHIFT, RIGHT, movewindow, r
bind = $mod SHIFT, UP, movewindow, u
bind = $mod SHIFT, DOWN, movewindow, d

# ==========================================
# WORKSPACES 1-10
# ==========================================

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# ==========================================
# MOVE WINDOWS TO WORKSPACES
# ==========================================

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# ==========================================
# WORKSPACE NAVIGATION
# ==========================================

bind = $mod, TAB, workspace, e+1
bind = $mod SHIFT, TAB, workspace, e-1

# ==========================================
# SCREENSHOTS
# ==========================================

bind = $mod SHIFT, S, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy

bind = , PRINT, exec, mkdir -p ~/Pictures/Screenshots && grim - | tee ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy
